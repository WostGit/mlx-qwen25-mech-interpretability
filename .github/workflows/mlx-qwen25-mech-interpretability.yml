                  print(json.dumps(GLOBAL["best_secret_logit_lens_layer"], indent=2, default=str))
              if "best_many_attack_geometry_layer" in GLOBAL:
                  print("Best global many-attack-to-one-secret geometry:")
                  print(json.dumps(GLOBAL["best_many_attack_geometry_layer"], indent=2, default=str))
              if "strongest_canary_patch" in GLOBAL:
                  print("Strongest global causal patch:")
                  print(json.dumps(GLOBAL["strongest_canary_patch"], indent=2, default=str))

              return {
                  "attack_methods_reported_to_console": len(global_scores),
                  "console_only": True,
                  "no_csv": True,
                  "no_artifacts": True,
              }

