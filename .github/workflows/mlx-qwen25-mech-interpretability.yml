              for rank, row in enumerate(sorted(global_scores, key=lambda r: r["risk_score"], reverse=True), 1):
                  print(
                      f"{rank:02d}. {row['case_id']} / {row['family']} | "
                      f"risk={row['risk_score']:.6f} | "
                      f"exact={row['exact']} | partial={row['partial']:.4f} | "
                      f"immediate_margin={row['immediate_margin']:.6f} | "
                      f"best_logit_margin={row['best_logit_margin']:.6f} | "
                      f"geometry={row['geom_margin']:.6f} | "
                      f"patch_shift={row['patch_shift']:.6f} | "
                      f"diagnosis={row['diagnosis']}"
                  )

              banner("GLOBAL BEST MECHANISTIC SIGNALS")
