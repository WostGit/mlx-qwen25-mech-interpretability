          @try_test("security_layerwise_representation_geometry")
          def test_security_layerwise_representation_geometry():
              all_traces = []
              labels = []

              for case in SECURITY_CASES:
                  prompt = classifier_prompt(case["text"])
                  input_ids, _ = ids_array(prompt)
                  _, trace = manual_forward(input_ids, collect=True)

                  all_traces.append(trace)
                  labels.append(case["label"])

              num_layers = len(all_traces[0])
              rows = []

              for layer in range(num_layers):
                  vectors = []

                  for trace in all_traces:
                      v = as_np(trace[layer]["resid_post"][0, -1, :])
                      vectors.append(v)

                  unsafe_vecs = [v for v, y in zip(vectors, labels) if y == "unsafe"]
                  benign_vecs = [v for v, y in zip(vectors, labels) if y == "benign"]

                  unsafe_centroid = centroid(unsafe_vecs)
                  benign_centroid = centroid(benign_vecs)

                  same_sims = []
                  diff_sims = []

                  for i in range(len(vectors)):
                      for j in range(i + 1, len(vectors)):
                          sim = cosine(vectors[i], vectors[j])
                          if labels[i] == labels[j]:
                              same_sims.append(sim)
                          else:
                              diff_sims.append(sim)

                  unsafe_tightness = [cosine(v, unsafe_centroid) for v in unsafe_vecs]
                  benign_tightness = [cosine(v, benign_centroid) for v in benign_vecs]

                  nca = nearest_centroid_accuracy(vectors, labels)

                  rows.append({
                      "layer": layer,
                      "same_label_mean_cosine": float(np.mean(same_sims)),
                      "different_label_mean_cosine": float(np.mean(diff_sims)),
                      "many_to_one_separation": float(np.mean(same_sims) - np.mean(diff_sims)),
                      "unsafe_centroid_tightness": float(np.mean(unsafe_tightness)),
                      "benign_centroid_tightness": float(np.mean(benign_tightness)),
                      "unsafe_benign_centroid_cosine": cosine(unsafe_centroid, benign_centroid),
                      "nearest_centroid_label_accuracy": nca,
                  })

              write_csv("security_layerwise_representation_geometry.csv", rows)

              best_sep = max(rows, key=lambda r: r["many_to_one_separation"])
              best_nca = max(rows, key=lambda r: r["nearest_centroid_label_accuracy"])

              GLOBAL["security_geometry_rows"] = rows
              GLOBAL["best_security_separation_layer"] = best_sep
              GLOBAL["best_security_nearest_centroid_layer"] = best_nca

              return {
                  "layers": num_layers,
                  "best_separation_layer": best_sep,
                  "best_nearest_centroid_layer": best_nca,
                  "csv": "mech_interp_artifacts/security_layerwise_representation_geometry.csv",
                  "plain_english": "This checks whether different unsafe prompts become closer to each other internally than they are to benign prompts.",
              }

          @try_test("security_causal_patch_unsafe_residual_into_benign_prompt")
          def test_security_causal_patch_unsafe_residual_into_benign_prompt():
              import mlx.core as mx

              unsafe_case = next(c for c in SECURITY_CASES if c["label"] == "unsafe")
              benign_case = next(c for c in SECURITY_CASES if c["label"] == "benign")

              unsafe_ids, _ = ids_array(classifier_prompt(unsafe_case["text"]))
              benign_ids, _ = ids_array(classifier_prompt(benign_case["text"]))

              unsafe_logits, unsafe_trace = manual_forward(unsafe_ids, collect=True)
              benign_logits, _ = manual_forward(benign_ids, collect=True)

              unsafe_base_pred, _, _, unsafe_base_margin = label_scores_from_logits(unsafe_logits)
              benign_base_pred, _, _, benign_base_margin = label_scores_from_logits(benign_logits)

              rows = []

              for item in unsafe_trace:
                  replacement = item["resid_post"][:, -1:, :]

                  patch = {
                      "stage": "resid_post",
                      "layer": item["layer"],
                      "mode": "replace",
                      "pos": -1,
                      "value": replacement,
                  }

                  patched_logits, _ = manual_forward(benign_ids, collect=False, patch=patch)
                  mx.eval(patched_logits)

                  pred, unsafe_score, benign_score, margin = label_scores_from_logits(patched_logits)

                  rows.append({
                      "patch_layer": item["layer"],
                      "source_case": unsafe_case["id"],
                      "destination_case": benign_case["id"],
                      "benign_base_pred": benign_base_pred,
                      "benign_base_margin": benign_base_margin,
                      "unsafe_source_pred": unsafe_base_pred,
                      "unsafe_source_margin": unsafe_base_margin,
                      "patched_pred": pred,
                      "patched_unsafe_score": unsafe_score,
                      "patched_benign_score": benign_score,
                      "patched_margin": margin,
                      "margin_shift_from_benign_base": margin - benign_base_margin,
                  })

              write_csv("security_causal_patch_unsafe_into_benign.csv", rows)

              strongest = max(rows, key=lambda r: r["margin_shift_from_benign_base"])

              GLOBAL["security_patch_rows"] = rows
              GLOBAL["strongest_security_patch"] = strongest

              return {
                  "rows": len(rows),
                  "strongest_patch": strongest,
                  "csv": "mech_interp_artifacts/security_causal_patch_unsafe_into_benign.csv",
                  "plain_english": "This patches an unsafe prompt's residual into a benign prompt. If the benign prompt shifts unsafe, that layer causally carries security-label information.",
              }

          @try_test("tiny_sae_smoke_on_cached_residuals")
          def test_tiny_sae_smoke():
              import mlx.core as mx
              import mlx.nn as nn
              import mlx.optimizers as optim

              trace = GLOBAL.get("clean_trace")
              if trace is None:
                  _, trace = manual_forward(GLOBAL["clean_ids_array"], collect=True)

              Xs = [
                  item["resid_post"].reshape(-1, item["resid_post"].shape[-1])
                  for item in trace[: min(4, len(trace))]
              ]

              X = mx.concatenate(Xs, axis=0)
              d = X.shape[-1]
              k = min(4 * d, 2048)

              class SAE(nn.Module):
                  def __init__(self):
                      super().__init__()
                      self.enc = nn.Linear(d, k, bias=True)
                      self.dec = nn.Linear(k, d, bias=True)

                  def __call__(self, x):
                      z = mx.maximum(self.enc(x), 0)
                      return self.dec(z), z

              sae = SAE()
              opt = optim.Adam(learning_rate=1e-3)

              def loss_fn(model, batch):
                  recon, z = model(batch)
                  mse = mx.mean((recon - batch) ** 2)
                  l1 = mx.mean(mx.abs(z))
                  return mse + 1e-3 * l1

              loss_and_grad = nn.value_and_grad(sae, loss_fn)
              losses = []

              for _ in range(3):
                  loss, grads = loss_and_grad(sae, X)
                  opt.update(sae, grads)
                  mx.eval(sae.parameters(), opt.state, loss)
                  losses.append(scalar(loss))

              return {
                  "input_shape": tuple(X.shape),
                  "hidden_dim": k,
                  "losses": losses,
              }

